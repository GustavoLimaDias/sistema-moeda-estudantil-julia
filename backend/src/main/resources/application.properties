spring.application.name=sistema-moeda-estudantil

server.port=${PORT:8080}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/moeda_estudantil?createDatabaseIfNotExist=true&serverTimezone=America/Sao_Paulo}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:true}
spring.jpa.open-in-view=false

app.cors.origins=${FRONT_URL:http://localhost:3000}

app.mail.from=${MAIL_FROM:no-reply@moedaestudantil.local}
